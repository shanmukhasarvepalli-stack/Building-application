<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shirt Store</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f5;color:#222}
header{background:#111;color:white;padding:18px 6%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-size:25px;font-weight:bold}.cart{background:white;color:#111;border:0;padding:10px 15px;border-radius:8px;cursor:pointer}
.hero{text-align:center;padding:50px 20px;background:linear-gradient(135deg,#222,#555);color:white}
.hero h1{font-size:40px;margin-bottom:10px}.hero p{color:#ddd}
.controls{max-width:1100px;margin:25px auto;padding:0 20px;display:flex;gap:10px}
.controls input,.controls select{padding:12px;border:1px solid #ccc;border-radius:8px;background:white}
.controls input{flex:1}
.products{max-width:1100px;margin:auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.product{background:white;border-radius:12px;overflow:hidden;box-shadow:0 4px 15px #0002;transition:.3s}
.product:hover{transform:translateY(-5px)}
.product img{width:100%;height:260px;object-fit:cover}
.product-info{padding:15px}.product-info h3{margin-bottom:8px}.price{font-size:19px;font-weight:bold;margin:8px 0}
.size{width:100%;padding:9px;margin:8px 0;border:1px solid #ccc;border-radius:6px}
.add{width:100%;padding:11px;border:0;background:#111;color:white;border-radius:7px;cursor:pointer}.add:hover{background:#333}
.cart-panel{position:fixed;right:-400px;top:0;width:360px;max-width:90%;height:100%;background:white;z-index:20;padding:25px;box-shadow:-5px 0 20px #0003;transition:.3s;overflow:auto}
.cart-panel.active{right:0}.close{float:right;border:0;background:#eee;padding:7px 10px;cursor:pointer}
.cart-item{border-bottom:1px solid #ddd;padding:15px 0}.cart-item h4{margin-bottom:5px}
.qty{display:flex;align-items:center;gap:10px;margin-top:8px}.qty button{border:0;padding:5px 10px;cursor:pointer}
.remove{background:#ff4d4d;color:white;border:0;padding:6px 10px;margin-top:8px;border-radius:5px;cursor:pointer}
.total{font-size:20px;font-weight:bold;margin:20px 0}.checkout{width:100%;padding:13px;border:0;background:#28a745;color:white;border-radius:7px;cursor:pointer;font-size:16px}
@media(max-width:600px){.hero h1{font-size:30px}.controls{flex-direction:column}.cart-panel{width:100%}}
</style>
</head>
<body>
<header>
<div class="logo">👕 ShirtStore</div>
<button class="cart" onclick="openCart()">🛒 Cart (<span id="cartCount">0</span>)</button>
</header>

<section class="hero"><h1>Premium Shirts</h1><p>Style that fits you perfectly.</p></section>

<div class="controls">
<input type="text" id="search" placeholder="🔍 Search shirts..." oninput="displayProducts()">
<select id="category" onchange="displayProducts()">
<option value="all">All Categories</option><option value="Casual">Casual</option><option value="Formal">Formal</option><option value="Denim">Denim</option>
</select>
<select id="sort" onchange="displayProducts()">
<option value="default">Sort By</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option>
</select>
</div>

<div class="products" id="products"></div>

<div class="cart-panel" id="cartPanel">
<button class="close" onclick="closeCart()">✕</button>
<h2>🛒 Your Cart</h2>
<div id="cartItems"></div>
<div class="total">Total: ₹<span id="total">0</span></div>
<button class="checkout" onclick="checkout()">Proceed to Checkout</button>
</div>

<script>
const products=[
{id:1,name:"Classic White Shirt",category:"Formal",price:799,image:"https://images.unsplash.com/photo-1603252109303-2751441dd157?auto=format&fit=crop&w=600&q=80"},
{id:2,name:"Black Casual Shirt",category:"Casual",price:699,image:"https://images.unsplash.com/photo-1596755389378-c31d21fd1273?auto=format&fit=crop&w=600&q=80"},
{id:3,name:"Blue Denim Shirt",category:"Denim",price:999,image:"https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&w=600&q=80"},
{id:4,name:"Sky Blue Formal",category:"Formal",price:899,image:"https://images.unsplash.com/photo-1598032895397-b9472444bf93?auto=format&fit=crop&w=600&q=80"},
{id:5,name:"Checked Casual Shirt",category:"Casual",price:749,image:"https://images.unsplash.com/photo-1589310243389-96a5483213a8?auto=format&fit=crop&w=600&q=80"},
{id:6,name:"Dark Denim Shirt",category:"Denim",price:1099,image:"https://images.unsplash.com/photo-1576995853123-5a10305d93c0?auto=format&fit=crop&w=600&q=80"},
{id:7,name:"Premium Grey Shirt",category:"Formal",price:1199,image:"https://images.unsplash.com/photo-1602810316498-ab67cf68c8e1?auto=format&fit=crop&w=600&q=80"},
{id:8,name:"Green Casual Shirt",category:"Casual",price:649,image:"https://images.unsplash.com/photo-1610652492500-ded49ceeb378?auto=format&fit=crop&w=600&q=80"}
];
let cart=[];

function displayProducts(){
const container=document.getElementById("products"),search=document.getElementById("search").value.toLowerCase(),category=document.getElementById("category").value,sort=document.getElementById("sort").value;
let filtered=products.filter(p=>p.name.toLowerCase().includes(search)&&(category==="all"||p.category===category));
if(sort==="low")filtered.sort((a,b)=>a.price-b.price);if(sort==="high")filtered.sort((a,b)=>b.price-a.price);
container.innerHTML="";
filtered.forEach(p=>container.innerHTML+=`
<div class="product"><img src="${p.image}" alt="${p.name}">
<div class="product-info"><h3>${p.name}</h3><p>${p.category}</p><div class="price">₹${p.price}</div>
<select class="size" id="size-${p.id}"><option>S</option><option>M</option><option>L</option><option>XL</option></select>
<button class="add" onclick="addToCart(${p.id})">Add to Cart</button></div></div>`);
}
function addToCart(id){
const p=products.find(x=>x.id===id),size=document.getElementById(`size-${id}`).value;
const existing=cart.find(x=>x.id===id&&x.size===size);
if(existing)existing.quantity++;else cart.push({...p,size,quantity:1});
updateCart();alert(p.name+" added to cart!");
}
function updateCart(){
const box=document.getElementById("cartItems");box.innerHTML="";let total=0,count=0;
cart.forEach((item,i)=>{total+=item.price*item.quantity;count+=item.quantity;box.innerHTML+=`
<div class="cart-item"><h4>${item.name}</h4><p>Size: ${item.size}</p><p>₹${item.price}</p>
<div class="qty"><button onclick="changeQty(${i},-1)">−</button><span>${item.quantity}</span><button onclick="changeQty(${i},1)">+</button></div>
<button class="remove" onclick="removeItem(${i})">Remove</button></div>`});
document.getElementById("total").innerText=total;document.getElementById("cartCount").innerText=count;
}
function changeQty(i,v){cart[i].quantity+=v;if(cart[i].quantity<=0)cart.splice(i,1);updateCart()}
function removeItem(i){cart.splice(i,1);updateCart()}
function openCart(){document.getElementById("cartPanel").classList.add("active")}
function closeCart(){document.getElementById("cartPanel").classList.remove("active")}
function checkout(){if(!cart.length){alert("Your cart is empty!");return}alert("🎉 Order placed successfully!\nThank you for shopping with ShirtStore.");cart=[];updateCart();closeCart()}
displayProducts();
</script>
</body>
</html>
